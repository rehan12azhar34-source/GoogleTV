name: Build Aura TV Launcher
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Gradle & Manifest
        run: |
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "AuraTV"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
            id("com.android.application") version "8.7.3" apply false
            id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
          }
          android {
            namespace = "com.auratv.launcher"
            compileSdk = 35
            defaultConfig {
              applicationId = "com.auratv.launcher"
              minSdk = 23
              targetSdk = 35
              versionCode = 1
              versionName = "1.0"
            }
            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_tv.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="48dp" android:height="48dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#11131A" android:pathData="M0,0h24v24h-24z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M8,5v14l11,-7z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-feature android:name="android.software.leanback" android:required="false"/>
            <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
            <queries>
              <intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent>
              <intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LEANBACK_LAUNCHER"/></intent>
            </queries>
            <application android:label="Aura TV" android:icon="@drawable/ic_tv" android:banner="@drawable/ic_tv"
              android:theme="@android:style/Theme.Material.NoActionBar.Fullscreen">
              <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask"
                android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenSize|screenLayout|smallestScreenSize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                  <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                </intent-filter>
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.HOME"/>
                  <category android:name="android.intent.category.DEFAULT"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AuraTV-Launcher-APK
          path: app/build/outputs/apk/debug/*.apk
