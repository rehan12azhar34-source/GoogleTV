name: Build Aura TV Launcher
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Project & Build APK
        run: |
          rm -f app/src/main/java/com/auratv/launcher/Tv*.kt
          mkdir -p app/src/main/res/drawable app/src/main/res/values app/src/main/res/layout

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "AuraTV"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
            id("com.android.application") version "8.7.3" apply false
            id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
          }
          android {
            namespace = "com.auratv.launcher"
            compileSdk = 35
            defaultConfig {
              applicationId = "com.auratv.launcher"
              minSdk = 23
              targetSdk = 35
              versionCode = 1
              versionName = "1.1"
            }
            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
            implementation("androidx.core:core-ktx:1.15.0")
            implementation("androidx.appcompat:appcompat:1.7.0")
            implementation("androidx.recyclerview:recyclerview:1.3.2")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
            <style name="Theme.AuraTV" parent="Theme.AppCompat.NoActionBar">
              <item name="android:windowBackground">#0B0C10</item>
              <item name="android:windowFullscreen">true</item>
              <item name="colorAccent">#E8EAED</item>
            </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_tv.xml
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item><shape android:shape="rectangle"><size android:width="48dp" android:height="48dp"/><solid android:color="#141824"/><corners android:radius="12dp"/></shape></item>
            <item android:top="12dp" android:bottom="12dp" android:left="12dp" android:right="12dp"><shape android:shape="oval"><solid android:color="#E50914"/></shape></item>
          </layer-list>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_tab.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:state_selected="true"><shape><solid android:color="#E8EAED"/><corners android:radius="20dp"/></shape></item>
            <item android:state_focused="true"><shape><solid android:color="#40FFFFFF"/><corners android:radius="20dp"/><stroke android:width="2dp" android:color="#FFFFFF"/></shape></item>
            <item><shape><solid android:color="#22FFFFFF"/><corners android:radius="20dp"/></shape></item>
          </selector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_pill.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:state_focused="true"><shape><solid android:color="#FFFFFF"/><corners android:radius="20dp"/><stroke android:width="2dp" android:color="#82B1FF"/></shape></item>
            <item><shape><solid android:color="#E8EAED"/><corners android:radius="20dp"/></shape></item>
          </selector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_card_focus.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><stroke android:width="3dp" android:color="#FFFFFF"/><corners android:radius="10dp"/></shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_ring_focus.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:state_focused="true"><shape android:shape="oval"><stroke android:width="3dp" android:color="#FFFFFF"/></shape></item>
            <item><shape android:shape="oval"><solid android:color="@android:color/transparent"/></shape></item>
          </selector>
          EOF

          cat << 'EOF' > app/src/main/res/layout/item_media_card.xml
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="184dp" android:layout_height="104dp" android:layout_marginEnd="14dp" android:clickable="true" android:focusable="true">
            <ImageView android:id="@+id/imgPoster" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#1A1D24" android:scaleType="centerCrop"/>
            <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_gravity="bottom" android:background="#A6000000" android:orientation="vertical" android:padding="7dp">
              <TextView android:id="@+id/txtCardTitle" android:layout_width="match_parent" android:layout_height="wrap_content" android:ellipsize="end" android:maxLines="1" android:textColor="#FFFFFF" android:textSize="12sp" android:textStyle="bold"/>
              <TextView android:id="@+id/txtCardMeta" android:layout_width="match_parent" android:layout_height="wrap_content" android:ellipsize="end" android:maxLines="1" android:textColor="#CCCCCC" android:textSize="10sp"/>
            </LinearLayout>
            <View android:id="@+id/focusBorder" android:layout_width="match_parent" android:layout_height="match_parent" android:background="@drawable/bg_card_focus" android:visibility="gone"/>
          </FrameLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/item_app_circle.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="78dp" android:layout_height="wrap_content" android:layout_marginEnd="12dp" android:clickable="true" android:focusable="true" android:gravity="center" android:orientation="vertical" android:padding="3dp">
            <FrameLayout android:layout_width="60dp" android:layout_height="60dp" android:foreground="@drawable/bg_ring_focus">
              <FrameLayout android:id="@+id/appCircleContainer" android:layout_width="match_parent" android:layout_height="match_parent" android:padding="9dp">
                <ImageView android:id="@+id/imgAppIcon" android:layout_width="match_parent" android:layout_height="match_parent" android:scaleType="fitCenter"/>
                <TextView android:id="@+id/txtAppFallback" android:layout_width="match_parent" android:layout_height="match_parent" android:gravity="center" android:textSize="10sp" android:textStyle="bold" android:visibility="gone"/>
              </FrameLayout>
            </FrameLayout>
            <TextView android:id="@+id/txtAppLabel" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="4dp" android:ellipsize="end" android:gravity="center" android:maxLines="1" android:textColor="#FFFFFF" android:textSize="11sp"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/item_app_grid.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_margin="6dp" android:background="@drawable/bg_tab" android:clickable="true" android:focusable="true" android:gravity="center" android:orientation="vertical" android:padding="12dp">
            <ImageView android:id="@+id/imgGridAppIcon" android:layout_width="46dp" android:layout_height="46dp" android:scaleType="fitCenter"/>
            <TextView android:id="@+id/txtGridAppName" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="6dp" android:ellipsize="end" android:gravity="center" android:maxLines="1" android:textColor="#FFFFFF" android:textSize="12sp" android:textStyle="bold"/>
            <TextView android:id="@+id/txtPinBadge" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="3dp" android:text="★ Pinned" android:textColor="#FFD54F" android:textSize="10sp" android:visibility="gone"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-feature android:name="android.software.leanback" android:required="false"/>
            <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
            <queries>
              <intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent>
              <intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LEANBACK_LAUNCHER"/></intent>
            </queries>
            <application android:label="Aura TV" android:icon="@drawable/ic_tv" android:banner="@drawable/ic_tv" android:theme="@style/Theme.AuraTV">
              <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask" android:screenOrientation="sensorLandscape"
                android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenSize|screenLayout|smallestScreenSize">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LEANBACK_LAUNCHER"/></intent-filter>
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.HOME"/><category android:name="android.intent.category.DEFAULT"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AuraTV-Launcher-APK
          path: app/build/outputs/apk/debug/*.apk
